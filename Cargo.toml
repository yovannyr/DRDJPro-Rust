[workspace]
members = [".", "crates/drdj-keylock"]
resolver = "2"

[package]
name = "drdjpro-ui-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "DrDJ Pro Rust desktop DJ application"

[dependencies]
drdj-keylock = { path = "crates/drdj-keylock" }
midir = "=0.10.3"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rfd = "=0.15.4"
opus-pure = "=0.2.2"
slint = "=1.18.1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-isomp4", "symphonia-aac", "symphonia-alac", "symphonia-flac", "symphonia-aiff", "symphonia-ogg", "symphonia-vorbis"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac", "alac", "flac", "aiff", "ogg", "vorbis"] }
ebur128 = "0.1"
rustfft = "6"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
windows = { version = "=0.54.0", features = ["Win32_Media_Audio", "Win32_Devices_Properties", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"
i-slint-backend-testing = "=1.18.1"
