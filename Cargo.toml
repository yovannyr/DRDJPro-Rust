[workspace]
members = ["."]
resolver = "2"

[package]
name = "drdjpro-ui-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "DrDJ Pro Rust desktop DJ application"

[dependencies]
rfd = "=0.15.4"
slint = "=1.18.1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = "=1.18.1"
