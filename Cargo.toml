[workspace]
members = [".", "crates/drdj-keylock", "crates/drdj-proto", "crates/drdj-usb", "crates/drdj-dvs", "crates/drdj-remote"]
resolver = "2"
exclude = ["vendor/minidumper"]

[patch.crates-io]
# Bounded socket I/O, including the macOS startup handshake; see vendor README.
minidumper = { path = "vendor/minidumper" }

[package]
name = "drdjpro-ui-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "DrDJ Pro Rust desktop DJ application"

[features]
default = []
# A binary linked with xwax must be distributed on GPLv3-compatible terms.
dvs-xwax = ["dep:drdj-dvs"]

[dependencies]
drdj-remote = { path = "crates/drdj-remote" }
drdj-keylock = { path = "crates/drdj-keylock" }
drdj-proto = { path = "crates/drdj-proto" }
drdj-usb = { path = "crates/drdj-usb" }
drdj-dvs = { path = "crates/drdj-dvs", optional = true }
midir = "=0.10.3"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled", "backup"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rfd = "=0.15.4"
opus-pure = "=0.2.2"
slint = "=1.18.1"
rodio = { version = "=0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-wav", "symphonia-pcm", "symphonia-isomp4", "symphonia-aac", "symphonia-alac", "symphonia-flac", "symphonia-aiff", "symphonia-ogg", "symphonia-vorbis"] }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
symphonia = { version = "0.5", default-features = false, features = ["mp3", "wav", "pcm", "isomp4", "aac", "alac", "flac", "aiff", "ogg", "vorbis"] }
ebur128 = "0.1"
rustfft = "6"
aes-gcm = { version = "0.10", features = ["std"] }
flume = "0.11"
thiserror = "2"
log = "0.4"
getrandom = "0.3"
crossbeam = "0.8"
rand = "0.9"
backtrace = "0.3"
minidump = "0.22"
chrono = "0.4"
dirs = "5"
tempfile = "=3.27.0"
minidumper = "=0.11.0"
crash-handler = "=0.8.1"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "windows")'.dependencies]
slint = { version = "=1.18.1", features = ["unstable-winit-030"] }
windows = { version = "=0.54.0", features = ["Win32_Media_Audio", "Win32_Devices_Properties", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_WindowsAndMessaging", "Win32_System_Diagnostics_Debug", "Win32_System_Threading", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "=3.27.0"
i-slint-backend-testing = "=1.18.1"

# Keep stack locations and debug assertions without full variable/type symbols
# or the large incremental cache. Applies to workspace members and dependencies.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.test]
debug = "line-tables-only"
incremental = false

# One reproducible test configuration replaces per-invocation CLI overrides.
# Interactive dev playback and codec optimizations below remain unchanged.
[profile.test.package.drdjpro-ui-spike]
opt-level = 0

[profile.dev.package.drdjpro-ui-spike]
opt-level = 1

[profile.dev.package.rodio]
opt-level = 2

[profile.dev.package.symphonia-core]
opt-level = 2

[profile.dev.package.symphonia-bundle-mp3]
opt-level = 2

[profile.dev.package.symphonia-bundle-flac]
opt-level = 2

[profile.dev.package.symphonia-codec-aac]
opt-level = 2

[profile.dev.package.symphonia-codec-alac]
opt-level = 2

[profile.dev.package.symphonia-codec-pcm]
opt-level = 2

[profile.dev.package.symphonia-codec-vorbis]
opt-level = 2

[profile.dev.package.symphonia-format-isomp4]
opt-level = 2

[profile.dev.package.symphonia-format-ogg]
opt-level = 2

[profile.dev.package.symphonia-format-riff]
opt-level = 2

[profile.dev.package.symphonia-metadata]
opt-level = 2

[profile.dev.package.symphonia-utils-xiph]
opt-level = 2

[profile.dev.package.opus-pure]
opt-level = 2
