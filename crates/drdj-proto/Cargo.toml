[package]
name = "drdj-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
description = "Schema-generated Protocol Buffers for DRDJPro-Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
thiserror = "2"
prost = "0.13"
prost-reflect = "0.14"
pbjson = "0.7"
pbjson-types = "0.7"
serde_json = "1.0"
log = "0.4"
serde_path_to_error = "0.1"

[build-dependencies]
prost-build = "0.13"
pbjson-build = "0.7"
protoc-bin-vendored = "3"

[dev-dependencies]
prost-types = "0.13"

[[bench]]
name = "codec"
harness = false
