[package]
name = "drdj-itunes"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Bounded local iTunes XML import and Apple Music metadata adapters"

[dependencies]
quick-xml = "=0.41.0"
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
percent-encoding = "=2.3.2"
rusqlite = { version = "=0.41.0", default-features = false, features = ["bundled"] }

[dev-dependencies]
tempfile = "=3.27.0"
