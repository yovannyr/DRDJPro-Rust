[package]
name = "drdj-ml"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "Isolated CPU inference backend experiment; no application integration"

[features]
default = []
ort = ["dep:ort", "dep:sha2", "dep:tempfile", "dep:windows"]
tract = ["dep:tract-onnx", "dep:tract-linalg", "dep:rayon"]

[dependencies]
ort = { version = "=2.0.0-rc.15", optional = true, default-features = false, features = ["std", "load-dynamic", "api-31"] }
tract-onnx = { version = "=0.23.8", optional = true, default-features = false }
tract-linalg = { version = "=0.23.8", optional = true, features = ["multithread-mm"] }
rayon = { version = "=1.12.0", optional = true }
sha2 = { version = "=0.10.9", optional = true }
tempfile = { version = "=3.27.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.54.0", optional = true, features = ["Win32_System_Threading"] }

[dev-dependencies]
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
