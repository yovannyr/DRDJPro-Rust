name: Rust UI prototype CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: drdjpro-linux
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            artifact: drdjpro-windows
            target: x86_64-pc-windows-msvc
          - os: macos-15
            artifact: drdjpro-macos-arm64
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev libegl1-mesa-dev libgl1-mesa-dev
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint Rust
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Fetch freely licensed music sample for integration tests
        shell: bash
        run: |
          mkdir -p tests/fixtures
          curl --fail --location --retry 3 --max-time 45 \
            https://samplelib.com/mp3/sample-9s.mp3 \
            --output tests/fixtures/sample-9s.mp3
          test "$(wc -c < tests/fixtures/sample-9s.mp3)" -gt 10000
      - name: Run tests
        env:
          SLINT_EMIT_DEBUG_INFO: '1'
          DRDJ_AUDIO_TEST_FILE: tests/fixtures/sample-9s.mp3
        run: cargo test --target ${{ matrix.target }}
      - name: Verify release decoder on real MP3
        run: cargo run --release --target ${{ matrix.target }} -- --analyze tests/fixtures/sample-9s.mp3
      - name: Archive audio fixture source
        shell: bash
        run: |
          echo "Music fixture: https://samplelib.com/mp3/sample-9s.mp3 (Samplelib license https://samplelib.com/license.html)" > tests/fixtures/SOURCE.txt
      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item "target/${{ matrix.target }}/release/drdjpro-ui-spike.exe" dist/
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/drdjpro-ui-spike" dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error
